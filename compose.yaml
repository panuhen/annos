services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: annos
      # Owner password. A strong value is injected in prod; `annos` is the
      # local-dev / test-suite default. The db has no host port in prod (below),
      # but a real password is the right posture for health data.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-annos}
      POSTGRES_DB: annos
      # Read by db/init/01-roles.sh to set the restricted annos_api password.
      ANNOS_API_DB_PASSWORD: ${ANNOS_API_DB_PASSWORD:-annos}
    volumes:
      - annos-pgdata:/var/lib/postgresql/data
      # Runs once on first start: creates the restricted annos_api role.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annos -d annos"]
      interval: 2s
      timeout: 3s
      retries: 20
    # The host port (5433, for psql and the test suite) lives in
    # compose.override.yaml, so production — compose.yaml alone — binds nothing
    # on the host and can share a Coolify box without port clashes.

  api:
    build: ./api
    image: annos-api:latest
    restart: unless-stopped
    environment:
      # Runtime role: no access to Better Auth's tables. That grant is the
      # email quarantine — see db/init/01-roles.sh.
      ANNOS_DATABASE_URL: postgresql+asyncpg://annos_api:${ANNOS_API_DB_PASSWORD:-annos}@db:5432/annos
      # Owner role, used only by the startup `alembic upgrade head` +
      # apply_grants (the api image's CMD) — never by the running app. There is
      # no separate migrate container: the platform forces restart on every
      # service, so a one-shot would loop; migrating on startup is the pattern.
      ANNOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://annos:${POSTGRES_PASSWORD:-annos}@db:5432/annos
      ANNOS_AUTH_BASE_URL: http://web:3000/api/auth
      # The issuer/audience Better Auth stamps into JWTs is its browser-facing
      # origin, not the URL the API fetches it by — so it is configured, not
      # derived. Dev default is localhost; prod is the public web origin.
      ANNOS_AUTH_JWT_ISSUER: ${ANNOS_AUTH_JWT_ISSUER:-http://localhost:3000}
      ANNOS_AUTH_JWT_AUDIENCE: ${ANNOS_AUTH_JWT_AUDIENCE:-http://localhost:3000}
      # This API's own public origin, advertised in the OAuth discovery
      # handshake (401 → WWW-Authenticate → /.well-known/...) and shown to MCP
      # clients. Its own subdomain in prod: https://mcp.annos.app.
      ANNOS_PUBLIC_BASE_URL: ${ANNOS_PUBLIC_BASE_URL:-http://localhost:8000}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  # Better Auth lives here: identity system and OAuth 2.1 authorization server.
  # If this is down, MCP clients can neither authenticate nor call tools.
  web:
    build:
      context: ./web
      # NEXT_PUBLIC_* are inlined at `next build`, so they must be present as
      # build args, not merely runtime env — Coolify passes the prod values
      # here. They are ALSO set as runtime env below, which is what the
      # override's `next dev` reads.
      args:
        NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:8000/mcp/}
        NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
        # Baked into the rewrite manifest at build (see web/Dockerfile). The
        # in-network address, since the Next server proxies /annos/* to the API.
        ANNOS_API_URL: ${ANNOS_API_URL:-http://api:8000}
    image: annos-web:latest
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-in-production-0000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Where the /annos/* rewrite proxies API calls — the browser itself
      # only ever talks to this origin.
      ANNOS_API_URL: http://api:8000
      # Owner role: Better Auth migrates and owns its tables; annos_api has
      # no SELECT on them — that grant is the email quarantine.
      DATABASE_URL: postgres://annos:${POSTGRES_PASSWORD:-annos}@db:5432/annos
      # Resend lives here, not in the API — email leaves the system only from
      # the identity layer that already holds it. Sourced from the repo-root
      # .env (untracked); blank in dev makes the senders log the link instead.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Google sign-in. Enabled only when the credentials are present; the
      # public flag gates the button in the browser.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:8000/mcp/}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/sign-in', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

volumes:
  annos-pgdata:
