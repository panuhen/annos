services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: annos
      POSTGRES_PASSWORD: annos
      POSTGRES_DB: annos
    ports:
      # 5433, not 5432, so a Postgres already running on the host doesn't clash.
      - "5433:5432"
    volumes:
      - annos-pgdata:/var/lib/postgresql/data
      # Runs once on first start: creates the restricted annos_api role.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annos -d annos"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: migrations run as the owner, since annos_api cannot create tables.
  # Shares the api image explicitly — without a pinned `image:` compose builds a
  # separate annos-migrate, and `docker compose build api` then leaves this one
  # stale, so migrations silently run old code.
  migrate:
    build: ./api
    image: annos-api:latest
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      ANNOS_MIGRATION_DATABASE_URL: postgresql+asyncpg://annos:annos@db:5432/annos
      ANNOS_DATABASE_URL: postgresql+asyncpg://annos:annos@db:5432/annos
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    image: annos-api:latest
    environment:
      # Runtime role: no access to Better Auth's tables. That grant is the
      # email quarantine — see db/init/01-roles.sql.
      ANNOS_DATABASE_URL: postgresql+asyncpg://annos_api:annos@db:5432/annos
      ANNOS_AUTH_BASE_URL: http://web:3000/api/auth
      # The issuer/audience Better Auth stamps into JWTs is its browser-facing
      # origin, not the URL the API fetches it by — so it is configured, not
      # derived.
      ANNOS_AUTH_JWT_ISSUER: http://localhost:3000
      ANNOS_AUTH_JWT_AUDIENCE: http://localhost:3000
      # This API's public origin, advertised in the OAuth discovery handshake
      # (401 → WWW-Authenticate → /.well-known/oauth-protected-resource/mcp/).
      ANNOS_PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Better Auth lives here: identity system and OAuth 2.1 authorization server.
  # If this is down, MCP clients can neither authenticate nor call tools.
  web:
    build: ./web
    image: annos-web:latest
    environment:
      BETTER_AUTH_SECRET: dev-only-secret-change-in-production-0000
      BETTER_AUTH_URL: http://localhost:3000
      # Where the /annos/* rewrite proxies API calls — the browser itself
      # only ever talks to this origin.
      ANNOS_API_URL: http://api:8000
      # Owner role: Better Auth migrates and owns its tables; annos_api has
      # no SELECT on them — that grant is the email quarantine.
      DATABASE_URL: postgres://annos:annos@db:5432/annos
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  annos-pgdata:
