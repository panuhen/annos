[project]
name = "annos"
version = "0.1.0"
description = "Diet and exercise tracker — MCP-native, client-agnostic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "structlog>=24.4",
    "coolname>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annos"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every test gets its own event loop, and conftest disposes the engine pool with
# it — an asyncpg connection belongs to the loop that opened it.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
